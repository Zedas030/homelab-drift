# /etc/nginx/sites-available/homelab-drift - generated homelab documentation (static, read-only) + Prometheus metrics
server {
    listen 8097;
    listen [::]:8097;
    server_name _;
    root /var/lib/homelab-drift/www;
    index index.html;
    charset utf-8;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    location / {
        try_files $uri $uri/ =404;
    }
    location = /metrics {
        default_type "text/plain; version=0.0.4; charset=utf-8";
        try_files /metrics =404;
    }
    # serve the generated pages only, never hidden files
    location ~ /\. { deny all; }
}
