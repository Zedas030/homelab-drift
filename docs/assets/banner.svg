      <stop offset="0" stop-color="#1B2A44"/>
      <stop offset="0.55" stop-color="#121C30"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#50ECDA" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#50ECDA" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#50ECDA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="disc" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#0C5A55"/>
      <stop offset="1" stop-color="#0E1626"/>
    </radialGradient>
    <clipPath id="card"><rect width="1600" height="560" rx="32"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
