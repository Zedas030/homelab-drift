      <circle cx="1220" cy="280" r="178" stroke-opacity="0.28" stroke-width="1.25"/>
      <circle cx="1220" cy="280" r="210" stroke-opacity="0.14" stroke-width="1"/>
    </g>
    <circle cx="1220" cy="280" r="122" fill="url(#disc)" stroke="#63EEDE" stroke-opacity="0.35"/>
    <g transform="translate(1133.6 193.6) scale(7.2)" fill="none" stroke="#63EEDE" stroke-width="0.42" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M4 12h16M4 17h7"/><circle cx="17" cy="7" r="2"/><circle cx="14" cy="17" r="2"/></g>
    <rect x="0.5" y="0.5" width="1599" height="559" rx="31.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
