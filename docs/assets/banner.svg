    <text x="104" y="300" fill="#F5F5F7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI Variable Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="96" font-weight="600" letter-spacing="-3.2">Homelab-Drift</text>
    <text x="112" y="366" fill="#D7DCE3" font-size="30" font-weight="400" letter-spacing="-0.4">Documentation generated from the real system state,</text>
    <text x="112" y="406" fill="#D7DCE3" font-size="30" font-weight="400" letter-spacing="-0.4">and an alert when reality drifts away from it.</text>
    <text x="112" y="470" fill="#8D97A5" font-size="17" font-weight="500" letter-spacing="0.2">SSH, read-only  ·  git history  ·  Home Assistant  ·  Prometheus</text>
